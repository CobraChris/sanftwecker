name: Sanftwecker Android - unsigned checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDK"
          "$SDK" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - name: Validate release request safety gates, without secrets
        run: |
          node --check scripts/sanftwecker-release-request.mjs
          node --test tests/sanftwecker-release-request.test.mjs
          node --check scripts/sanftwecker-v23-release-request.mjs
          node --test tests/sanftwecker-v23-release-request.test.mjs
          node --check scripts/sanftwecker-v24-release-request.mjs
          node --test tests/sanftwecker-v24-release-request.test.mjs
          node --check scripts/sanftwecker-v25-release-request.mjs
          node --test tests/sanftwecker-v25-release-request.test.mjs
          node --check scripts/sanftwecker-v26-release-request.mjs
          node --test tests/sanftwecker-v26-release-request.test.mjs
      - name: Verify v46 owner-gated release policy (unsigned only)
        run: |
          node --check scripts/sanftwecker-v46-release-request.mjs
          node --test tests/sanftwecker-v46-release-request.test.mjs
          node --test tests/watch-phone-relay-v46-contract.test.mjs
      - name: Verify protected v47 original-signer release gate (unsigned only)
        run: |
          node --check scripts/sanftwecker-v47-release-request.mjs
          node --test tests/sanftwecker-v47-release-request.test.mjs
      - name: Verify v47 timer extensions and personalized colors
        run: node --test tests/timer-extend-color-v47-contract.test.mjs
      - name: Verify v48 owner-only release policy and guided companion update
        run: |
          node --check scripts/sanftwecker-v48-release-request.mjs
          node --test tests/sanftwecker-v48-release-request.test.mjs
          node --test tests/v48-guided-companion-update-contract.test.mjs
      - name: Verify v49 protected dual-device release gate (unsigned only)
        run: |
          node --check scripts/sanftwecker-v49-release-request.mjs
          node --test tests/sanftwecker-v49-release-request.test.mjs
      - name: Verify v54 owner-only original-signer dual-device release gate (unsigned only)
        run: |
          node --check scripts/sanftwecker-v54-release-request.mjs
          node --test tests/sanftwecker-v54-release-request.test.mjs
      - name: Verify v53 owner-only original-signer release gate (unsigned only)
        run: |
          node --check scripts/sanftwecker-v53-release-request.mjs
          node --test tests/sanftwecker-v53-release-request.test.mjs
      - name: Verify v52 owner-only original-signer release gate (unsigned only)
        run: |
          node --check scripts/sanftwecker-v52-release-request.mjs
          node --test tests/sanftwecker-v52-release-request.test.mjs
      - name: Verify v51 original-signer release gate (unsigned only)
        run: |
          node --check scripts/sanftwecker-v51-release-request.mjs
          node --test tests/sanftwecker-v51-release-request.test.mjs
      - name: Verify v50 owner-controlled original signer release gate (unsigned only)
        run: |
          node --check scripts/sanftwecker-v50-release-request.mjs
          node --test tests/sanftwecker-v50-release-request.test.mjs
      - name: Verify five reminder choices on phone and Galaxy Watch
        run: node --test tests/v51-reminder-quick-choices.test.mjs
      - name: Verify v51 reminder tab and one-step Watch installation UX
        run: node --test tests/v51-watch-update-one-step-ux.test.mjs
      - name: Verify shared reminder cascade, legacy persistence and Watch compatibility
        run: node --test tests/v53-shared-reminder-cascade-contract.test.mjs
      - name: Verify old and new reminders share the existing wake alarm cascade
        run: node --test tests/v54-cascade-reuse-regressions.test.mjs
      - name: Verify time-sensitive reminder full-screen display and options
        run: node --test tests/v53-reminder-fullscreen-contract.test.mjs
      - name: Verify v52 reminder edits, lockscreen snooze and safe screenshot import
        run: node --test tests/v52-reminder-import-snooze-permission-contract.test.mjs
      - name: Verify v50 independent voice-enabled reminders and cascade contracts
        run: node --test tests/v50-reminders-foundation-contract.test.mjs
      - name: Verify v49 licensed Wear tile, watch-face, and confirmed timer feedback
        run: node --test tests/v49-open-source-wear-integration.test.mjs
      - name: Verify v49 immediately visible Watch timer extensions
        run: node --test tests/v49-watch-timer-visible-quick-actions.test.mjs
      - name: Verify Watch alarm screen and fallback regression contracts
        run: node --test tests/watch-alarm-screen-contract.test.mjs
      - name: Verify visible Watch alarm and timer notification safeguards
        run: node --test tests/watch-visible-alarm-notification-contract.test.mjs
      - name: Verify secure Watch self-update contracts
        run: node --test tests/watch-self-update-contract.test.mjs
      - name: Verify round Watch controls and updater access
        run: node --test tests/watch-round-screen-controls.test.mjs
      - name: Verify Watch alarm dashboard and read-only schedule projection
        run: node --test tests/watch-dashboard-upcoming-alarms-contract.test.mjs
      - name: Verify final navigation and alarm countdown UI contracts
        run: node --test tests/sanftwecker-navigation-polish.test.mjs
      - name: Verify permission wizard and alarm safety UI contracts
        run: node --test tests/setup-assistant-contract.test.mjs
      - name: Verify compact alarm detail without functionality regressions
        run: node --test tests/alarm-detail-ux-contract.test.mjs
      - name: Verify instant alarm time save and accessible stop without bypass
        run: node --test tests/alarm-time-auto-save-stop-accessibility-contract.test.mjs
      - name: Verify responsive alarm detail and accessibility contracts
        run: node --test tests/sanftwecker-responsive-accessibility.test.mjs
      - name: Verify updater action order and signature safety remain intact
        run: node --test tests/update-action-order-contract.test.mjs
      - name: Verify sustained timer ringing and lockscreen control contracts
        run: node --test tests/timer-ringing-reliability-contract.test.mjs
      - name: Verify timer overrun and paired Galaxy Watch alerts
        run: node --test tests/timer-watch-overrun-contract.test.mjs
      - name: Verify phone live timer screen and both Watch stop paths
        run: node --test tests/live-timer-and-watch-stop-contract.test.mjs
      - name: Verify timer live target time is removed without lost settings
        run: node --test tests/timer-remove-live-target-contract.test.mjs
      - name: Verify large and readable stopwatch time
        run: node --test tests/stopwatch-large-display-contract.test.mjs
      - name: Verify protected v33 self-update test release gate (unsigned only)
        run: |
          node --check scripts/sanftwecker-v33-release-request.mjs
          node --test tests/sanftwecker-v33-release-request.test.mjs
      - name: Verify protected v34 original signer release gate (unsigned only)
        run: |
          node --check scripts/sanftwecker-v34-release-request.mjs
          node --test tests/sanftwecker-v34-release-request.test.mjs
      - name: Verify protected v35 original-signer release gate (unsigned only)
        run: |
          node --check scripts/sanftwecker-v35-release-request.mjs
          node --test tests/sanftwecker-v35-release-request.test.mjs
      - name: Verify protected v36 original-signer release gate (unsigned only)
        run: |
          node --check scripts/sanftwecker-v36-release-request.mjs
          node --test tests/sanftwecker-v36-release-request.test.mjs
      - name: Verify protected v37 original-signer navigation release gate (unsigned only)
        run: |
          node --check scripts/sanftwecker-v37-release-request.mjs
          node --test tests/sanftwecker-v37-release-request.test.mjs
      - name: Verify protected v38 original-signer navigation polish release gate (unsigned only)
        run: |
          node --check scripts/sanftwecker-v38-release-request.mjs
          node --test tests/sanftwecker-v38-release-request.test.mjs
      - name: Verify protected v39 original-signer final navigation release gate (unsigned only)
        run: |
          node --check scripts/sanftwecker-v39-release-request.mjs
          node --test tests/sanftwecker-v39-release-request.test.mjs
      - name: Verify protected v40 original-signer permission setup test release gate (unsigned only)
        run: |
          node --check scripts/sanftwecker-v40-release-request.mjs
          node --test tests/sanftwecker-v40-release-request.test.mjs
      - name: Verify protected v41 original-signer design release gate (unsigned only)
        run: |
          node --check scripts/sanftwecker-v41-release-request.mjs
          node --test tests/sanftwecker-v41-release-request.test.mjs
      - name: Verify protected v42 original-signer timer release gate (unsigned only)
        run: |
          node --check scripts/sanftwecker-v42-release-request.mjs
          node --test tests/sanftwecker-v42-release-request.test.mjs
      - name: Verify protected v43 original-signer Watch timer release gate (unsigned only)
        run: |
          node --check scripts/sanftwecker-v43-release-request.mjs
          node --test tests/sanftwecker-v43-release-request.test.mjs
      - name: Verify protected v44 original-signer live timer and Watch release gate (unsigned only)
        run: |
          node --check scripts/sanftwecker-v44-release-request.mjs
          node --test tests/sanftwecker-v44-release-request.test.mjs
      - name: Verify protected v45 original-signer visual Watch alarm release gate (unsigned only)
        run: |
          node --check scripts/sanftwecker-v45-release-request.mjs
          node --test tests/sanftwecker-v45-release-request.test.mjs
      - name: Tests, lint and unsigned debug build
        run: gradle --no-daemon :alarm:testDebugUnitTest :alarm:lintDebug :alarm:assembleDebug :watch:testDebugUnitTest :watch:lintDebug :watch:assembleDebug
      - name: Build unsigned release APK for migration preflight
        run: gradle --no-daemon :alarm:assembleRelease :watch:assembleRelease
      - name: Verify published v18-v20 signed bridge digests and certificate lineage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash -n scripts/verify-migration-baseline.sh
          bash scripts/verify-migration-baseline.sh
      - name: Verify Android application identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.cobrachris.sanftwecker'" alarm/build.gradle
          test -s alarm/build/outputs/apk/debug/alarm-debug.apk
          test -s watch/build/outputs/apk/debug/watch-debug.apk
          grep -q "applicationId 'com.cobrachris.sanftwecker'" watch/build.gradle
          grep -q "applicationId 'com.cobrachris.sanftwecker'" alarm/build.gradle
          grep -q "play-services-wearable" alarm/build.gradle
          grep -q "play-services-wearable" watch/build.gradle
          grep -q "FOREGROUND_SERVICE_SPECIAL_USE" watch/src/main/AndroidManifest.xml
          test -s watch/build/outputs/apk/release/watch-release-unsigned.apk
