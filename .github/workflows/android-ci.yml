name: Sanftwecker Android - unsigned checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDK"
          "$SDK" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - name: Tests, lint and unsigned debug build
        run: gradle --no-daemon :alarm:testDebugUnitTest :alarm:lintDebug :alarm:assembleDebug
      - name: Verify Android application identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.cobrachris.sanftwecker'" alarm/build.gradle
          test -s alarm/build/outputs/apk/debug/alarm-debug.apk
