plugins {
    id 'com.android.application'
}
android {
    namespace 'com.cobrachris.watchvibrationpoc'
    compileSdk 35
    defaultConfig {
        applicationId 'com.cobrachris.watchvibrationpoc'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '0.1-watch'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
}
